name: 4 · Auto-destruir (red de seguridad)

# Cada noche borra todo, por si me olvido de apagarlo. Se puede lanzar a mano también.
# 23:00 UTC = 01:00 en Madrid en horario de verano.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: empresa-en-una-caja
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_email_alertas: ${{ vars.ALERT_EMAIL }}

jobs:
  auto-destruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=empresa-en-una-caja.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform destroy
        working-directory: infra
        run: terraform destroy -auto-approve
